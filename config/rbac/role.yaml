---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - redteam.ephemera.dev
  resources:
  - redteamruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redteam.ephemera.dev
  resources:
  - redteamruns/finalizers
  verbs:
  - update
- apiGroups:
  - redteam.ephemera.dev
  resources:
  - redteamruns/status
  verbs:
  - get
  - patch
  - update
