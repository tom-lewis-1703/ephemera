# This rule is not used by the project ephemera itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the redteam.ephemera.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemera
    app.kubernetes.io/managed-by: kustomize
  name: redteamrun-editor-role
rules:
- apiGroups:
  - redteam.ephemera.dev
  resources:
  - redteamruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redteam.ephemera.dev
  resources:
  - redteamruns/status
  verbs:
  - get
