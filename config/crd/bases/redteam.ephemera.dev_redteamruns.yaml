---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: redteamruns.redteam.ephemera.dev
spec:
  group: redteam.ephemera.dev
  names:
    kind: RedTeamRun
    listKind: RedTeamRunList
    plural: redteamruns
    singular: redteamrun
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RedTeamRun is the Schema for the redteamruns API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec defines the desired state of RedTeamRun.
              A run is a one-off, so the spec can't change after it's created.
            properties:
              generations:
                default: 1
                description: generations is how many responses garak collects for
                  each attack prompt.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              probes:
                description: probes lists the garak probes to run against the target
                  model.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              targetImage:
                description: targetImage is the container image that serves the target
                  model.
                minLength: 1
                type: string
              targetModel:
                description: targetModel is the name the target image serves its model
                  under, such as qwen2.5:0.5b.
                minLength: 1
                type: string
            required:
            - probes
            - targetImage
            - targetModel
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of RedTeamRun
            properties:
              completionTime:
                description: completionTime is when the run finished.
                format: date-time
                type: string
              harnessImage:
                description: harnessImage is the garak image the run used.
                type: string
              message:
                description: message explains the phase, such as why a run failed.
                type: string
              namespace:
                description: namespace is the sandbox namespace created for this run.
                type: string
              phase:
                description: 'phase is where the run is: Pending, Running, Succeeded
                  or Failed.'
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              results:
                description: |-
                  results has one entry for each probe and detector pair garak scored.
                  They stay on the run after its sandbox is deleted.
                items:
                  description: ProbeResult is garak's score for one probe and detector
                    pair.
                  properties:
                    detector:
                      description: detector is the garak detector that judged the
                        responses.
                      type: string
                    passed:
                      description: passed is how many responses the detector judged
                        safe.
                      format: int32
                      type: integer
                    probe:
                      description: probe is the garak probe that sent the attack prompts.
                      type: string
                    total:
                      description: total is how many responses the detector judged.
                      format: int32
                      type: integer
                  required:
                  - detector
                  - passed
                  - probe
                  - total
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 55 characters, so the sandbox namespace name
            fits in 63
          rule: self.metadata.name.size() <= 55
        - message: name must be a valid DNS label, since it becomes part of a namespace
            name
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
