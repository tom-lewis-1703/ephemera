# TODO: this sits at Programmed=False on kind. envoy gateway makes the proxy
# Service a LoadBalancer and kind has no LB provider, so it never gets an
# address. fix is probably NodePort on 30080 to match kind-config.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ephemera-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ephemera
  namespace: ephemera-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              ephemera.dev/preview: "true"
